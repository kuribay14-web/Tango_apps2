<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>単語帳アプリ（クラウド同期・起動時自動読込）</title>
<style>
  body { font-family: -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
         max-width: 820px; margin: 24px auto; padding: 0 14px; background:#fafafa; color:#222; }
  h1 { text-align: center; margin: 8px 0 18px; }
  h2 { margin: 18px 0 10px; }
  .card { background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:14px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.03); }
  label { display:block; margin:8px 0 4px; font-weight:600; }
  input[type="text"], input[type="file"], select { width:100%; box-sizing:border-box; font-size:16px; padding:10px 12px; border:1px solid #ccc;
                               border-radius:8px; background:#fff; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row-3 { display:grid; grid-template-columns:2fr 2fr 1.4fr; gap:12px; }
  button { font-size:16px; padding:12px 16px; border-radius:8px; border:1px solid #999; background:#f3f3f3; cursor:pointer; }
  button:active { background:#e7e7e7; }
  .btn-primary { background:#2b7cff; border-color:#2b7cff; color:#fff; }
  .btn-danger { background:#ff4d4f; border-color:#ff4d4f; color:#fff; }
  .small { padding:6px 10px; font-size:14px; }
  #word { font-size:2rem; font-weight:700; min-height:48px; text-align:center; word-break:break-word; }
  #meaning { margin-top:8px; font-size:1.2rem; color:#555; text-align:center; display:none; word-break:break-word; }
  #noWords { color:#d33; text-align:center; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { padding:10px 8px; border-bottom:1px solid #eee; vertical-align:top; }
  th { text-align:left; background:#fafcff; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .muted { color:#777; font-size:14px; }
  @media (max-width:520px){
    .row, .row-3 { grid-template-columns:1fr; }
    button { width:100%; }
  }
</style>
</head>
<body>

<h1>単語帳アプリ</h1>

<!-- 出題カード -->
<div class="card">
  <h2>出題</h2>
  <div class="controls" style="margin-bottom:10px;">
    <label for="filter" style="margin:0;">品詞で絞り込み：</label>
    <select id="filter">
      <option value="">すべて</option>
      <option value="動詞">動詞</option>
      <option value="形容詞">形容詞</option>
      <option value="名詞">名詞</option>
      <option value="副詞">副詞</option>
      <option value="chunk">chunk</option>
      <option value="言い回し">言い回し</option>
      <option value="相槌">相槌</option>
      <option value="接続詞">接続詞</option>
      <option value="phrase">phrase</option>
    </select>
    <button id="nextBtn" class="btn-primary">次の単語</button>
    <button id="showBtn">意味を表示</button>
  </div>
  <div id="word"></div>
  <div id="meaning"></div>
  <div id="noWords"></div>
</div>

<!-- 登録フォーム -->
<div class="card">
  <h2>新規登録</h2>
  <div class="row-3">
    <div>
      <label for="enInput">英語（必須）</label>
      <input id="enInput" type="text" placeholder="例: tolerance">
    </div>
    <div>
      <label for="jpInput">日本語（必須）</label>
      <input id="jpInput" type="text" placeholder="例: 耐性">
    </div>
    <div>
      <label for="typeInput">品詞（必須）</label>
      <select id="typeInput">
        <option value="">選択してください</option>
        <option value="動詞">動詞</option>
        <option value="形容詞">形容詞</option>
        <option value="名詞">名詞</option>
        <option value="副詞">副詞</option>
        <option value="chunk">chunk</option>
        <option value="言い回し">言い回し</option>
        <option value="相槌">相槌</option>
        <option value="接続詞">接続詞</option>
        <option value="phrase">phrase</option>
      </select>
    </div>
  </div>

  <div class="controls" style="margin-top:10px; display:flex; align-items:center; gap:10px;">
    <button id="addBtn" class="btn-primary">登録する</button>

    <!-- 自動クラウド保存トグル -->
    <label style="display:inline-flex; align-items:center; gap:6px;">
      <input id="autoCloudSync" type="checkbox" checked>
      自動でクラウド保存
    </label>

    <span id="addMsg" class="muted"></span>
  </div>
</div>

<!-- データインポート -->
<div class="card">
  <h2>データインポート</h2>
  <div class="row">
    <div>
      <label for="importFile">ファイルを選択（JSON / CSV）</label>
      <input id="importFile" type="file" accept=".json,.csv,application/json,text/csv">
    </div>
    <div>
      <label for="importMode">取り込み方法</label>
      <select id="importMode">
        <option value="append">既存データに追加</option>
        <option value="replace">既存データを上書き</option>
      </select>
    </div>
  </div>
  <div class="controls" style="margin-top:10px;">
    <button id="importBtn" class="btn-primary">インポートする</button>
    <span id="importMsg" class="muted"></span>
  </div>
  <div class="muted" style="margin-top:8px; line-height:1.6;">
    JSON形式：[{"word":"That's cool","meaning":"それいいね","type":"相槌"}]<br>
    CSV形式：1行目を word,meaning,type または 英語,日本語,品詞 にしてください
  </div>
</div>

<!-- クラウド保存・読み込みボタン -->
<div style="margin-top: 20px;">
  <button id="cloudSaveBtn">☁️ クラウドに保存</button>
  <button id="cloudLoadBtn">☁️ クラウドから読み込み</button>
  <span id="cloudMsg" style="margin-left: 10px; color: gray;"></span>
</div>

<!-- 一覧 -->
<div class="card">
  <h2>登録一覧</h2>
  <div class="row">
    <div>
      <label for="searchInput">検索（英語/日本語を部分一致）</label>
      <input id="searchInput" type="text" placeholder="例: idea / アイディア">
    </div>
    <div>
      <label for="listFilter">品詞で絞り込み</label>
      <select id="listFilter">
        <option value="">すべて</option>
        <option value="動詞">動詞</option>
        <option value="形容詞">形容詞</option>
        <option value="名詞">名詞</option>
        <option value="副詞">副詞</option>
        <option value="chunk">chunk</option>
        <option value="言い回し">言い回し</option>
        <option value="相槌">相槌</option>
        <option value="接続詞">接続詞</option>
        <option value="phrase">phrase</option>
      </select>
    </div>
  </div>

  <div style="overflow:auto;">
    <table id="listTable">
      <thead>
        <tr>
          <th style="min-width:180px;">英語</th>
          <th style="min-width:220px;">日本語</th>
          <th style="min-width:110px;">品詞</th>
          <th style="min-width:120px;">操作</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<script>
// ====== 初期データ（クラウド運用：空） ======
const SEED = []; // クラウドのみ運用のため空配列

const LS_KEY = "vocab_words_v1";

// ====== ストレージ管理 ======
function loadWords() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return [...SEED];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [...SEED];
    return parsed;
  } catch(e) {
    return [...SEED];
  }
}
function saveWords(arr) {
  localStorage.setItem(LS_KEY, JSON.stringify(arr));
}

// ====== 状態 ======
let words = loadWords();
let currentList = [...words];
let currentWord = null;

// ====== DOM 取得 ======
const wordEl = document.getElementById("word");
const meaningEl = document.getElementById("meaning");
const filterEl = document.getElementById("filter");
const noWordsEl = document.getElementById("noWords");
const nextBtn = document.getElementById("nextBtn");
const showBtn = document.getElementById("showBtn");

const enInput = document.getElementById("enInput");
const jpInput = document.getElementById("jpInput");
const typeInput = document.getElementById("typeInput");
const addBtn = document.getElementById("addBtn");
const addMsg = document.getElementById("addMsg");

const listBody = document.getElementById("listBody");
const searchInput = document.getElementById("searchInput");
const listFilter = document.getElementById("listFilter");

const importFile = document.getElementById("importFile");
const importMode = document.getElementById("importMode");
const importBtn = document.getElementById("importBtn");
const importMsg = document.getElementById("importMsg");

// ====== 出題系 ======
function pickRandom(list) {
  if (list.length === 0) return null;
  const i = Math.floor(Math.random() * list.length);
  return list[i];
}
function showWord() {
  if (!currentWord) return;
  wordEl.textContent = currentWord.word;
  meaningEl.style.display = "none";
  meaningEl.textContent = "";
  noWordsEl.textContent = "";
}
function showMeaning() {
  if (!currentWord) return;
  meaningEl.style.display = "block";
  meaningEl.textContent = `${currentWord.meaning} (${currentWord.type})`;
}
function applyQuizFilter() {
  const type = filterEl.value;
  currentList = type ? words.filter(w => w.type === type) : [...words];
  if (currentList.length === 0) {
    wordEl.textContent = "";
    meaningEl.style.display = "none";
    noWordsEl.textContent = "該当する単語がありません。";
    currentWord = null;
  } else {
    noWordsEl.textContent = "";
    currentWord = pickRandom(currentList);
    showWord();
  }
}

// ====== ユーティリティ ======
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

// ====== 一覧描画（編集ボタン付き） ======
function renderList(data = words) {
  listBody.innerHTML = "";
  if (data.length === 0) {
    listBody.innerHTML = `<tr><td colspan="4" class="muted">データがありません。</td></tr>`;
    return;
  }
  data.forEach((w) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${escapeHtml(w.word)}</td>
      <td>${escapeHtml(w.meaning)}</td>
      <td>${escapeHtml(w.type)}</td>
      <td>
        <button class="small" data-act="edit">編集</button>
        <button class="btn-danger small" data-act="del">削除</button>
      </td>
    `;
    tr.querySelector('[data-act="edit"]').addEventListener("click", () => startEdit(w));
    tr.querySelector('[data-act="del"]').addEventListener("click",  () => deleteEntry(w));
    listBody.appendChild(tr);
  });
}

// ====== 一覧フィルタ（検索＋品詞） ======
function applyListFilter() {
  const q = (searchInput.value || "").toLowerCase();
  const t = listFilter.value;
  let data = [...words];
  if (t) data = data.filter(w => w.type === t);
  if (q) data = data.filter(w =>
    (w.word || "").toLowerCase().includes(q) ||
    (w.meaning || "").toLowerCase().includes(q) ||
    (w.meaning || "").includes(searchInput.value)
  );
  renderList(data);
}

// ====== データインポート ======
function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (ch === ',' && !inQuotes) {
      row.push(cell);
      cell = "";
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += ch;
    }
  }
  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

function normalizeImportedItem(item) {
  if (!item || typeof item !== "object") return null;
  const word = String(item.word ?? item.en ?? item.english ?? item["英語"] ?? "").trim();
  const meaning = String(item.meaning ?? item.jp ?? item.japanese ?? item["日本語"] ?? "").trim();
  const type = String(item.type ?? item.partOfSpeech ?? item["品詞"] ?? "").trim();
  if (!word || !meaning || !type) return null;
  return { word, meaning, type };
}

function csvToItems(text) {
  const rows = parseCsv(text.replace(/^\uFEFF/, ""));
  if (rows.length === 0) return [];

  const normalizedHeader = rows[0].map(v => v.trim().toLowerCase());
  const aliases = {
    word: ["word", "en", "english", "英語"],
    meaning: ["meaning", "jp", "japanese", "日本語"],
    type: ["type", "partofspeech", "part_of_speech", "品詞"]
  };
  const findIndex = names => normalizedHeader.findIndex(h => names.includes(h));
  const wordIndex = findIndex(aliases.word);
  const meaningIndex = findIndex(aliases.meaning);
  const typeIndex = findIndex(aliases.type);
  const hasHeader = wordIndex >= 0 && meaningIndex >= 0 && typeIndex >= 0;
  const dataRows = hasHeader ? rows.slice(1) : rows;

  return dataRows.map(cols => normalizeImportedItem({
    word: cols[hasHeader ? wordIndex : 0],
    meaning: cols[hasHeader ? meaningIndex : 1],
    type: cols[hasHeader ? typeIndex : 2]
  })).filter(Boolean);
}

async function importData() {
  const file = importFile.files?.[0];
  if (!file) {
    importMsg.textContent = "ファイルを選択してください";
    return;
  }

  try {
    const text = await file.text();
    let imported = [];
    const isJson = file.name.toLowerCase().endsWith(".json") || file.type.includes("json");

    if (isJson) {
      const parsed = JSON.parse(text.replace(/^\uFEFF/, ""));
      if (!Array.isArray(parsed)) throw new Error("JSONの最上位は配列にしてください");
      imported = parsed.map(normalizeImportedItem).filter(Boolean);
    } else {
      imported = csvToItems(text);
    }

    if (imported.length === 0) throw new Error("取り込めるデータがありません");

    if (importMode.value === "replace") {
      if (!confirm(`現在のデータを削除して、${imported.length}件で上書きしますか？`)) return;
      words = imported;
      importMsg.textContent = `${imported.length}件を上書きしました`;
    } else {
      let added = 0;
      let skipped = 0;
      const existing = new Set(words.map(makeKey));
      imported.forEach(item => {
        const key = makeKey(item);
        if (existing.has(key)) {
          skipped++;
        } else {
          words.push(item);
          existing.add(key);
          added++;
        }
      });
      importMsg.textContent = `${added}件を追加しました（重複${skipped}件を除外）`;
    }

    saveWords(words);
    applyQuizFilter();
    applyListFilter();
    importFile.value = "";
    scheduleCloudSave();
  } catch (e) {
    importMsg.textContent = "インポートに失敗しました：" + e.message;
  }
}

// ====== 自動クラウド保存（デバウンス） ======
let cloudSaveTimer = null;
let cloudSaving = false;
function scheduleCloudSave() {
  const auto = document.getElementById("autoCloudSync");
  if (!auto || !auto.checked) return;
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    if (cloudSaving) return;
    try {
      cloudSaving = true;
      await saveToCloud();
    } finally {
      cloudSaving = false;
    }
  }, 2000);
}

// ====== 編集サポート ======
let editingKey = null;
function makeKey(item) { return `${item.word}__${item.meaning}__${item.type}`; }

function startEdit(item) {
  enInput.value = item.word;
  jpInput.value = item.meaning;
  typeInput.value = item.type;
  editingKey = makeKey(item);
  addMsg.textContent = "編集中です。内容を変更して「更新する」を押してください。";
  document.getElementById("addBtn").textContent = "更新する";

  if (!document.getElementById("cancelEditBtn")) {
    const cancelBtn = document.createElement("button");
    cancelBtn.id = "cancelEditBtn";
    cancelBtn.textContent = "キャンセル";
    cancelBtn.style.marginLeft = "8px";
    cancelBtn.addEventListener("click", cancelEdit);
    addBtn.insertAdjacentElement("afterend", cancelBtn);
  }
}
function cancelEdit() {
  editingKey = null;
  enInput.value = "";
  jpInput.value = "";
  typeInput.value = "";
  addMsg.textContent = "編集をキャンセルしました。";
  document.getElementById("addBtn").textContent = "登録する";
  document.getElementById("cancelEditBtn")?.remove();
}

// ====== 登録・更新 ======
function addOrUpdateEntry() {
  const en = enInput.value.trim();
  const jp = jpInput.value.trim();
  const tp = typeInput.value;
  if (!en || !jp || !tp) {
    addMsg.textContent = "英語・日本語・品詞はすべて必須です。";
    return;
  }
  const newItem = { word: en, meaning: jp, type: tp };

  if (editingKey === null) {
    // 新規：重複チェック
    const exists = words.some(w => w.word === en && w.meaning === jp && w.type === tp);
    if (exists) { addMsg.textContent = "同一のレコードが既に存在します。"; return; }
    words.unshift(newItem);
    addMsg.textContent = "登録しました。";
  } else {
    // 更新：自分以外と重複しないか確認
    const idx = words.findIndex(w => makeKey(w) === editingKey);
    if (idx === -1) { addMsg.textContent = "編集対象が見つかりませんでした。"; return; }
    const dup = words.some((w, i) => i !== idx && w.word === en && w.meaning === jp && w.type === tp);
    if (dup) { addMsg.textContent = "更新後の内容が既存レコードと重複します。"; return; }
    words[idx] = newItem;
    addMsg.textContent = "更新しました。";
    editingKey = null;
    document.getElementById("addBtn").textContent = "登録する";
    document.getElementById("cancelEditBtn")?.remove();
  }

  saveWords(words);

  // 入力クリア
  enInput.value = "";
  jpInput.value = "";
  typeInput.value = "";

  // UI更新
  applyQuizFilter();
  applyListFilter();

  // UI更新のあとに自動保存
  scheduleCloudSave();
}

// ====== 削除 ======
function deleteEntry(item) {
  if (!confirm(`削除しますか？\n英語: ${item.word}\n日本語: ${item.meaning}`)) return;
  const i = words.findIndex(w => makeKey(w) === makeKey(item));
  if (i >= 0) {
    words.splice(i, 1);
    saveWords(words);

    if (editingKey && editingKey === makeKey(item)) {
      cancelEdit(); // 編集中の対象を消した場合は解除
    }

    // UI更新
    applyQuizFilter();
    applyListFilter();

    // UI更新のあとに自動保存
    scheduleCloudSave();
  }
}

/* ====== 起動時：クラウド自動読み込み（失敗時はローカル/空のまま） ====== */
async function tryLoadFromCloudAtBoot() {
  try {
    const url = "https://raw.githubusercontent.com/kuribay14-web/Tango_apps2/main/data.json?ts=" + Date.now();
    const res = await fetch(url);
    if (!res.ok) return false;
    const data = await res.json();
    if (!Array.isArray(data)) return false;
    words = data;
    saveWords(words);
    document.getElementById("cloudMsg").textContent = "☁️ 起動時にクラウドから同期しました";
    return true;
  } catch (_) {
    return false;
  }
}
async function boot() {
  await tryLoadFromCloudAtBoot();  // 成否に関わらず続行
  applyQuizFilter();
  renderList();
}

// ====== イベント紐付け ======
nextBtn.addEventListener("click", () => {
  if (currentList.length === 0) { noWordsEl.textContent = "単語がありません。"; return; }
  currentWord = pickRandom(currentList);
  showWord();
});
showBtn.addEventListener("click", showMeaning);
filterEl.addEventListener("change", applyQuizFilter);

addBtn.addEventListener("click", addOrUpdateEntry);
searchInput.addEventListener("input", applyListFilter);
listFilter.addEventListener("change", applyListFilter);
importBtn.addEventListener("click", importData);

// ====== 初期表示（起動） ======
boot();
</script>

<script>
const API_BASE = "https://tango-apps2.vercel.app"; // ←あなたのVercel URL

// クラウド保存機能
async function saveToCloud() {
  try {
    const res = await fetch(`${API_BASE}/api/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: words })
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById("cloudMsg").textContent = "✅ クラウドに保存しました（GitHubに反映済み）";
  } catch (e) {
    document.getElementById("cloudMsg").textContent = "❌ 保存に失敗しました：" + e.message;
  }
}

// クラウド読み込み機能（手動同期）
async function loadFromCloud() {
  try {
    const url = "https://raw.githubusercontent.com/kuribay14-web/Tango_apps2/main/data.json?ts=" + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("JSONが配列ではありません");
    if (!confirm("クラウドのデータで上書きしますか？")) return;
    words = data;
    saveWords(words);
    applyQuizFilter();
    applyListFilter();
    document.getElementById("cloudMsg").textContent = "✅ クラウドから読み込みました";
  } catch (e) {
    document.getElementById("cloudMsg").textContent = "❌ 読み込みに失敗しました：" + e.message;
  }
}
document.getElementById("cloudSaveBtn").addEventListener("click", saveToCloud);
document.getElementById("cloudLoadBtn").addEventListener("click", loadFromCloud);
</script>

</body>
</html>
